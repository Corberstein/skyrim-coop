name: Anniversary artifact integrity and Defender scan

on:
  workflow_dispatch:
  push:
    branches:
      - audit-anniversary-defender-20261008
    paths:
      - .github/workflows/anniversary-artifact-audit.yml
      - tools/Inspect-AnniversaryArtifact.ps1

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect ${{ matrix.variant }} without executing it
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify original archives and run on-demand Defender scan
        shell: pwsh
        env:
          AUDIT_TOKEN: ${{ github.token }}
        run: ./tools/Inspect-AnniversaryArtifact.ps1 -Variant '${{ matrix.variant }}'
      - name: Preserve inspection evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anniversary-${{ matrix.variant }}-inspection
          path: audit-results/
          archive: true
          if-no-files-found: error
          retention-days: 30
